<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="./layout.css">
<body>
    <div class="a">
            <h3><b>TECH / STORE</b></h3>
            <p class="a1">Sản phẩm · Ưu đãi · Hỗ trợ</p>
            
            <div class="cart-container">
                <button class="a2">Giỏ hàng</button>
                <span class="gia">0</span>
            </div>
        </div>

        <div class="b">
            <span class="new-collection">NEW COLLECTION</span>
            <h1>Gear tốt hơn.<br>Học tập tập trung hơn.</h1>
            <p class="b-desc">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
            <button class="b1">Khám phá sản phẩm</button>
        </div>

        <h2><b>Sản phẩm nổi bật</b></h2>

        <!-- Danh sách sản phẩm -->
        <div class="product-list">
            <div class="product-card">
                <div class="image-box">
                    <span class="discount">-10%</span>
                    <img src="./keyboard.jpg" alt="Keyboard">
                </div>
                <h3><b>Nova Keyboard</b></h3>
                <p><b>1.290.000₫</b></p>
            </div>

            <div class="product-card">
                <div class="image-box">
                    <span class="discount">-15%</span>
                    <img src="./headphone.jpg" alt="Headphones">
                </div>
                <h3><b>Pulse Headphones</b></h3>
                <p><b>890.000₫</b></p>
            </div>

            <div class="product-card">
                <div class="image-box">
                    <span class="discount">-20%</span>
                    <img src="./buble.jpg" alt="Light">
                </div>
                <h3><b>Orbit Desk Light</b></h3>
                <p><b>490.000₫</b></p>
            </div>    
        </div>
    
</body>
</html>
